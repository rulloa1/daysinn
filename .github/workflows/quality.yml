name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Run the gate stage by stage rather than through `npm run verify`, so a
      # failure names the stage that broke instead of one opaque exit code.
      # `npm run verify` still chains the same stages in the same order locally.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm run verify` builds, which regenerates src/routeTree.gen.ts. If that
      # leaves the tree dirty, the committed copy was stale — the state that kept
      # this gate red on every branch until it was noticed.
      - name: Check generated files are current
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Check production dependency severity
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Run database integration tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Detect isolated integration-test credentials
        id: integration-config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_PUBLISHABLE_KEY" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run database integration tests
        if: steps.integration-config.outputs.available == 'true'
        run: npm run test:integration

      - name: Explain skipped integration coverage
        if: steps.integration-config.outputs.available != 'true'
        run: |
          echo "::notice::Database integration tests are not enabled. Configure the three SUPABASE_TEST_* repository secrets for an isolated non-production project."
